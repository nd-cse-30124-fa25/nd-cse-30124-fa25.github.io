name: Nightly Build and Publish

on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tornado markdown PyYAML python-dateutil requests nbconvert

      - name: Build site
        run: make build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs pages/*.html static/homework_htmls || true
          if ! git diff --cached --quiet; then
            git commit -m "Nightly build: refresh resources from CSV"
            git push
          else
            echo "No changes to commit"
          fi
