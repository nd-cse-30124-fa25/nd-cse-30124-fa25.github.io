name: Build and Publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  build_and_publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main (source)
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tornado markdown PyYAML python-dateutil requests nbconvert

      - name: Build site
        working-directory: source
        env:
          COURSE_RESOURCES_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vRcrLDHvgcPt1pwnPWyf3glaEr7rrdHh6RWyX7sTlD1oBMNhYCk2e0tjbYp3bc8w18pdQp7tvp2tczt/pub?gid=1486073670&single=true&output=csv
        run: |
          mkdir -p static/csv
          curl -L -s "$COURSE_RESOURCES_CSV_URL" -o static/csv/resources.csv
          make clean && make build

      - name: Checkout gh-pages (publish)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 0

      - name: Sync built docs to gh-pages/docs
        run: |
          rsync -a --delete source/docs/ publish/docs/

      - name: Commit and push to gh-pages
        working-directory: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if ! git diff --cached --quiet; then
            git commit -m "Automated build: refresh resources from CSV"
            git push origin gh-pages
          else
            echo "No changes to commit"
          fi
