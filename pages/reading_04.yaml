title:      "Reading 04: Markov Models and Bayesian Reasoning"
icon:       fa-book
navigation:
  - name: "Home"
    link: "index.html"
    icon: "fa-gavel"
internal:
external:
    resources:  'csv:static/csv/resources.csv'
body:       |

    {% set lec_markov = 'lec-' + slugify('Markov Models') %}
    {% set lec_bayes  = 'lec-' + slugify('Bayesian Reasoning') %}
    {% set res_markov = page.external.get('resources', {}).get(lec_markov, []) %}
    {% set res_bayes  = page.external.get('resources', {}).get(lec_bayes,  []) %}

    **Everyone**:

    ## Markov Models

    <div class="row">
        <div class="col-md-4">
            <h4><i class="fa-solid fa-book"></i> Readings</h4>
            <ul>
            {% for r in res_markov %}
                {% if r['type'] == 'reading' %}
                    <li><a href="{{ r['link'] }}">{{ r['name'] }}</a>{% if r.get('student') %} <span style="font-size: 0.8em; color: #999;">{{ r['student'] }}</span>{% end %}</li>
                {% end %}
            {% end %}
            </ul>
        </div>
        <div class="col-md-4">
            <h4><i class="fa-solid fa-video-camera"></i> Videos</h4>
            <ul>
            {% for r in res_markov %}
                {% if r['type'] == 'video' %}
                    <li><a href="{{ r['link'] }}">{{ r['name'] }}</a>{% if r.get('student') %} <span style="font-size: 0.8em; color: #999;">{{ r['student'] }}</span>{% end %}</li>
                {% end %}
            {% end %}
            </ul>
        </div>
        <div class="col-md-4">
            <h4><i class="fa-brands fa-python"></i> Notebooks</h4>
            <ul>
            {% for r in res_markov %}
                {% if r['type'] == 'notebook' %}
                    <li><a href="{{ r['link'] }}">{{ r['name'] }}</a>{% if r.get('student') %} <span style="font-size: 0.8em; color: #999;">{{ r['student'] }}</span>{% end %}</li>
                {% end %}
            {% end %}
            </ul>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <h4><i class="fa-solid fa-share-alt"></i> Blogposts</h4>
            <ul>
            {% for r in res_markov %}
                {% if r['type'] == 'blogpost' %}
                    <li><a href="{{ r['link'] }}">{{ r['name'] }}</a>{% if r.get('student') %} <span style="font-size: 0.8em; color: #999;">{{ r['student'] }}</span>{% end %}</li>
                {% end %}
            {% end %}
            </ul>
        </div>
        <div class="col-md-6">
            <h4><i class="fa-solid fa-file-pdf"></i> Papers</h4>
            <ul>
            {% for r in res_markov %}
                {% if r['type'] == 'paper' %}
                    <li><a href="{{ r['link'] }}">{{ r['name'] }}</a>{% if r.get('student') %} <span style="font-size: 0.8em; color: #999;">{{ r['student'] }}</span>{% end %}</li>
                {% end %}
            {% end %}
            </ul>
        </div>
    </div>

