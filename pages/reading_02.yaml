    ## Materials

    ### Constraint Satisfaction

    1. [Foundations of Computational Agents](https://artint.info/3e/html/ArtInt3e.html)

        - [Sections 4.1 through 4.6 (Reading)](https://artint.info/3e/html/ArtInt3e.Ch4.html)

    2. Additional Resources

        - [Harvard CS50 (Video)](https://youtu.be/qK46ET1xk2A?si=tSAHHe0Sp-OxWUpD&t=3033)
        - [Stanford CS221 (Video)](https://www.youtube.com/watch?v=-IO4fPO0rxk&list=PLoROMvodv4rOca_Ovz1DvdtWuz8BfSWL2&index=23)
        - [MIT 6.034 (Video)](https://www.youtube.com/watch?v=dARl_gGrS4o)
        - [CSPs for Sudoku (Blog Post)](https://medium.com/my-udacity-ai-nanodegree-notes/solving-sudoku-think-constraint-satisfaction-problem-75763f0742c9)
        - [Consistency in Networks of Relations (Mackworth) (Paper)](https://www.sciencedirect.com/science/article/pii/0004370277900078)
        - [Network Based Heuristics for Constraint Satisfaction Problems (Dechter and Pearl) (Paper)](https://ics.uci.edu/~csp/r3.pdf)
        - [Increasing Tree Search Efficiency for Constraint Satisfaction Problems (Haralick and Elliot) (Paper)](https://www.sciencedirect.com/science/article/pii/000437028090051X)

